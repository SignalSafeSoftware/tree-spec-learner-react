<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">TreeSpec incident response example flow</title>
  <desc id="desc">A branching TreeSpec flow from triage through investigation and recovery, with compromised, at-risk, and safe terminal outcomes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c757d" />
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#172b4d" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="1120" height="560" fill="#f5f7fa" />
  <text x="40" y="42" fill="#212529" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="700">TreeSpec example flow</text>
  <text x="40" y="68" fill="#6c757d" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">Incident-response example from simulator-core/examples/multi-node-incident-flow.ts</text>

  <g fill="none" stroke="#6c757d" stroke-width="2" marker-end="url(#arrow)">
    <path d="M 320 222 C 365 222 380 185 430 185" />
    <path d="M 180 360 C 180 405 330 405 330 435" />
    <path d="M 730 185 C 770 185 785 185 820 185" />
    <path d="M 580 280 C 580 365 620 385 620 435" />
    <path d="M 950 280 C 950 365 930 390 930 435" />
  </g>

  <g fill="#495057" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">
    <text x="350" y="198">investigate</text>
    <text x="210" y="399">dismiss</text>
    <text x="757" y="169">escalate</text>
    <text x="590" y="366">reimage</text>
    <text x="945" y="366">close</text>
  </g>

  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="40" y="170" width="280" height="190" rx="10" fill="#ffffff" stroke="#dee2e6" />
    <rect x="40" y="170" width="280" height="48" rx="10" fill="#ffffff" />
    <rect x="40" y="208" width="280" height="10" fill="#ffffff" />
    <rect x="56" y="184" width="70" height="23" rx="5" fill="#0d6efd" />
    <text x="91" y="200" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">PROMPT</text>
    <text x="285" y="200" text-anchor="end" fill="#6c757d" font-size="12">Node: triage</text>
    <line x1="40" y1="218" x2="320" y2="218" stroke="#dee2e6" />
    <text x="60" y="248" fill="#212529" font-size="15" font-weight="600">An employee reports a suspicious</text>
    <text x="60" y="270" fill="#212529" font-size="15" font-weight="600">attachment. What is the first response?</text>
    <text x="60" y="305" fill="#6c757d" font-size="12">investigate</text>
    <text x="60" y="328" fill="#212529" font-size="13">Investigate headers and isolate device</text>
    <text x="60" y="350" fill="#6c757d" font-size="12">dismiss</text>
  </g>

  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="430" y="90" width="300" height="190" rx="10" fill="#ffffff" stroke="#dee2e6" />
    <rect x="446" y="104" width="84" height="23" rx="5" fill="#0d6efd" />
    <text x="488" y="120" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">PROMPT</text>
    <text x="695" y="120" text-anchor="end" fill="#6c757d" font-size="12">Node: investigate</text>
    <line x1="430" y1="138" x2="730" y2="138" stroke="#dee2e6" />
    <text x="450" y="168" fill="#212529" font-size="15" font-weight="600">The attachment contacted an unknown</text>
    <text x="450" y="190" fill="#212529" font-size="15" font-weight="600">host. What do you do next?</text>
    <text x="450" y="225" fill="#6c757d" font-size="12">escalate</text>
    <text x="450" y="247" fill="#212529" font-size="13">Escalate and preserve evidence</text>
    <text x="450" y="270" fill="#6c757d" font-size="12">reimage</text>
  </g>

  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="820" y="90" width="260" height="190" rx="10" fill="#ffffff" stroke="#dee2e6" />
    <rect x="836" y="104" width="68" height="23" rx="5" fill="#20c997" />
    <text x="870" y="120" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">INFO</text>
    <text x="1045" y="120" text-anchor="end" fill="#6c757d" font-size="12">Node: recovery</text>
    <line x1="820" y1="138" x2="1080" y2="138" stroke="#dee2e6" />
    <text x="840" y="170" fill="#212529" font-size="14" font-weight="600">Notify stakeholders, document</text>
    <text x="840" y="192" fill="#212529" font-size="14" font-weight="600">the timeline, and restore safely.</text>
    <text x="840" y="232" fill="#6c757d" font-size="12">close</text>
    <text x="840" y="254" fill="#212529" font-size="13">Close incident</text>
  </g>

  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="225" y="435" width="210" height="78" rx="10" fill="#fff5f5" stroke="#dc3545" />
    <text x="245" y="464" fill="#dc3545" font-size="12" font-weight="700">END · COMPROMISED</text>
    <text x="245" y="488" fill="#495057" font-size="12">Unsafe dismissal path</text>

    <rect x="515" y="435" width="210" height="78" rx="10" fill="#fff8e1" stroke="#ffc107" />
    <text x="535" y="464" fill="#946200" font-size="12" font-weight="700">END · AT RISK</text>
    <text x="535" y="488" fill="#495057" font-size="12">Evidence may be lost</text>

    <rect x="825" y="435" width="230" height="78" rx="10" fill="#effcf6" stroke="#198754" />
    <text x="845" y="464" fill="#198754" font-size="12" font-weight="700">END · SAFE</text>
    <text x="845" y="488" fill="#495057" font-size="12">Incident handled safely</text>
  </g>

  <text x="40" y="540" fill="#6c757d" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Nodes expose prompts and choices; transitions determine the next node or terminal outcome.</text>
</svg>
