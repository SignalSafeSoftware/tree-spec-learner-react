<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" role="img" aria-labelledby="title desc">
  <title id="title">TreeSpec decision feedback toast</title>
  <desc id="desc">A DeliveryPlus-styled feedback toast with a title, body, red flags, takeaway, and close button.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#172b4d" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="620" height="300" fill="#f5f7fa" />
  <g filter="url(#shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="30" y="25" width="560" height="250" rx="10" fill="#ffffff" stroke="#dee2e6" />
    <text x="55" y="60" fill="#212529" font-size="17" font-weight="700">Good instinct</text>
    <text x="55" y="84" fill="#6c757d" font-size="13">You paused before trusting the attachment.</text>
    <rect x="475" y="42" width="87" height="34" rx="6" fill="#ffffff" stroke="#6c757d" />
    <text x="518" y="64" text-anchor="middle" fill="#6c757d" font-size="13">Close</text>

    <text x="55" y="118" fill="#6c757d" font-size="12">Red flags</text>
    <text x="70" y="140" fill="#495057" font-size="13">• Unexpected request</text>
    <text x="70" y="161" fill="#495057" font-size="13">• Suspicious attachment</text>

    <rect x="55" y="185" width="510" height="56" rx="6" fill="#eaf3ff" />
    <text x="70" y="208" fill="#212529" font-size="13" font-weight="700">Takeaway:</text>
    <text x="145" y="208" fill="#212529" font-size="13">Verify through a trusted channel</text>
    <text x="145" y="227" fill="#212529" font-size="13">before opening or responding.</text>
  </g>
</svg>
